<!doctype html>
<html lang="es">

<head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z2VZW040HN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

    <meta charset="utf-8">
    <!-- se pone mapa-aviario/ para produccion y se quita para local -->
    <!-- <base href="/mapa-aviario/"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aviarius Bird Experience – Taino Bay Puerto Plata</title>
    <meta name="description"
        content="Welcome to Aviarius Bird Experience at Taino Bay Puerto Plata. Get ready to explore and have a day to remember! Discover Aviarius and get the Port Taino Bay map.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Work+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/blazter" rel="stylesheet">
    <style>
        :root {
            --green-dark: #1B2D1A;
            --green-mid: #253D22;
            --cream: #F4EEE0;
            --orange: #E07B28;
            --orange-hover: #C86A18;
            --dark-text: #243524;
            ;
            --white: #fff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Lato", sans-serif;
            background: var(--cream);
            color: var(--dark-text);
        }

        /* ═══════════════════════════════════════════════════
           DESKTOP (> 900px) — fixed two-column layout
        ═══════════════════════════════════════════════════ */
        .page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: var(--cream);
        }

        /* ── Left hero panel — dark green jungle ── */
        .hero-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 52vw;
            height: 100%;
            background: var(--green-dark) url('assets/fondo.png') center/cover no-repeat;
            overflow: hidden;
            z-index: 0;
        }

        /* Depth gradient overlay */
        .hero-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 90% 70% at 10% 90%, rgba(0, 0, 0, 0.45) 0%, transparent 65%),
                radial-gradient(ellipse 70% 50% at 85% 10%, rgba(50, 90, 45, 0.25) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Wave divider — organic S-curve between green and cream */
        .wave-divider {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 54vw;
            pointer-events: none;
            z-index: 5;
        }

        .wave-divider img {
            height: 100%;
            width: 100%;
            object-fit: fill;
            display: block;
        }

        /* ── Birds ── */
        .bird {
            position: absolute;
            z-index: 3;
        }

        .bird-white {
            top: 15%;
            left: 4vw;
            width: clamp(130px, 48vw, 450px);
            height: auto;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
        }

        .bird-blue {
            position: absolute;
            top: 35%;
            left: 28vw;
            width: clamp(130px, 48vw, 450px);
            height: auto;
            transform: rotate(-8deg);
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.2));
            z-index: 20;
        }

        .bird-parrot {
            top: 50%;
            left: 1vw;
            width: clamp(150px, 42vw, 360px);
            height: auto;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
        }

        /* ── Plant decoration desktop ── */
        .plant-center {
            position: absolute;
            bottom: 0;
            left: 49vw;
            transform: translateX(-50%);
            width: clamp(100px, 14vw, 210px);
            height: auto;
            z-index: 20;
            pointer-events: none;
        }

        /* ── Taino Bay logo desktop hero ── */
        .hero-logo {
            position: absolute;
            bottom: clamp(50px, 10vh, 100px);
            left: clamp(120px, 30vw, 350px);
            width: clamp(110px, 14vw, 200px);
            height: auto;
            z-index: 5;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
        }

        /* ── Content panel — right side desktop ── */
        .content {
            position: absolute;
            top: 0;
            right: 0;
            width: 48vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(14px, 2.2vh, 34px);
            padding: clamp(20px, 3vw, 60px) clamp(20px, 3vw, 60px);
            text-align: center;
            background: var(--cream);
            z-index: 6;
        }

        .aviarius-logo {
            width: clamp(200px, 28vw, 420px);
            height: auto;
            display: block;
        }

        .subtitle {
            font-weight: 700;
            color: var(--dark-text);
            font-size: clamp(14px, 32px, 32px);
            line-height: 1.15;
            margin: 2rem 0;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 1.8vw, 30px);
            width: 100%;
            align-items: center;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(10px, 2vw, 30px);
            background: var(--orange);
            border-radius: 16px;
            color: var(--white);
            text-decoration: none;
            padding: clamp(12px, 1.5vh, 20px) clamp(24px, 2.5vw, 38px);
            width: clamp(240px, 34vw, 480px);
            font-family: 'BLAZTER', 'Lato', sans-serif;
            font-size: 36px;
            font-weight: 400 !important;
            letter-spacing: 0.02em;
            transition: background 0.22s, transform 0.22s, box-shadow 0.22s;
            box-shadow: 0 4px 18px rgba(224, 123, 40, 0.32);
        }

        .cta-btn:hover {
            background: var(--orange-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(224, 123, 40, 0.48);
        }

        .cta-btn:focus-visible {
            outline: 3px solid var(--green-dark);
            outline-offset: 3px;
        }

        .btn-text {
            flex: 1;
            text-align: left;
        }

        .btn-arrow-icon {
            width: clamp(12px, 1.2vw, 22px);
            height: auto;
            flex-shrink: 0;
            display: block;
        }

        .social-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 1vh, 12px);
        }

        .social-label {
            font-size: clamp(14px, 32px, 32px);
            font-weight: 700;
            color: var(--dark-text);
            text-align: center;
            margin: 3rem 0 1rem;
        }

        .social-icons {
            display: flex;
            align-items: center;
            gap: clamp(18px, 2.5vw, 42px);
        }

        .social-icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
        }

        .social-icon-link:hover {
            transform: scale(1.14);
            opacity: 0.82;
        }

        .social-icon {
            height: clamp(34px, 3.8vw, 58px);
            height: auto;
            display: block;
        }

        .content-plant {
            position: absolute;
            bottom: -5%;
            right: -10%;
            width: clamp(140px, 18vw, 290px);
            height: auto;
            pointer-events: none;
            opacity: 1;
            z-index: 7;
        }

        .mobile-plant-left,
        .mobile-plant-right {
            display: none;
        }

        .photo-section,
        .mobile-footer {
            display: none;
        }

        /* ═══════════════════════════════════════════════════
           TABLET & MOBILE (≤ 900px) — stacked layout
        ═══════════════════════════════════════════════════ */
        @media (max-width: 900px) {

            .page {
                position: relative;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto;
                background: var(--cream);
            }

            .hero-panel,
            .wave-divider,
            .content-plant,
            .desktop-only {
                display: none !important;
            }

            /* ─ Mobile hero section with texture background ─ */
            .photo-section {
                display: block;
                position: relative;
                width: 100%;
                overflow: hidden;
                height: 46vh;
                min-height: 350px;
                max-height: 500px;
                background: var(--green-dark) url('assets/fondo.jpg') center/cover no-repeat;
            }

            .photo-overlay {
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at center, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.35) 100%);
                z-index: 1;
            }

            /* Mobile birds — EVEN LARGER size matching official screenshot */
            .mobile-bird-white {
                position: absolute;
                top: 5%;
                left: 5%;
                width: clamp(160px, 52vw, 290px);
                height: auto;
                z-index: 3;
                filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.3));
            }

            .mobile-bird-blue {
                position: absolute;
                top: 30%;
                right: 5%;
                width: clamp(150px, 52vw, 260px);
                height: auto;
                z-index: 3;
                filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.25));
            }

            .mobile-bird-parrot {
                position: absolute;
                top: 40%;
                left: 5%;
                width: clamp(160px, 42vw, 290px);
                height: auto;
                z-index: 3;
                filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
            }

            /* Taino Bay logo — centered below birds */
            .mobile-taino-logo {
                position: absolute;
                top: 65%;
                left: 50%;
                transform: translateX(-50%);
                width: clamp(100px, 32vw, 170px);
                height: auto;
                z-index: 4;
                filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
            }

            /* Cream wave at the bottom of hero */
            .photo-wave {
                position: absolute;
                bottom: -1px;
                left: 0;
                width: 100%;
                height: 56px;
                z-index: 5;
            }

            .photo-wave svg {
                display: block;
                width: 100%;
                height: 100%;
            }

            /* ─ Content — taller cream section with narrower content ─ */
            .content {
                position: relative;
                width: 100%;
                min-height: 54vh;
                height: auto;
                flex: 1;
                padding: clamp(24px, 5vw, 44px) clamp(28px, 8vw, 60px) clamp(45px, 10vw, 85px);
                gap: clamp(12px, 2.5vw, 20px);
                justify-content: center;
                align-items: center;
                background: var(--cream);
                overflow: hidden;
            }

            .content>* {
                position: relative;
                z-index: 2;
            }

            .aviarius-logo {
                display: block;
                width: clamp(160px, 54vw, 280px);
            }

            .subtitle {
                font-size: clamp(15px, 28px, 32px);
                font-weight: 700;
                padding: 1rem 0;
                line-height: 1.15;
            }

            .cta-btn {
                width: clamp(190px, 64vw, 290px);
                font-size: 24px;
                padding: clamp(11px, 2vw, 16px) clamp(18px, 3.5vw, 28px);
                box-shadow: 0 4px 14px rgba(224, 123, 40, 0.28);
            }

            .social-icons {
                gap: clamp(16px, 4vw, 30px);
            }

            .social-label {
                font-size: clamp(14px, 32px, 32px);
                font-weight: 700;
                text-align: center;
                margin: 2rem 0 1rem;
            }

            .social-icon {
                width: clamp(34px, 7.8vw, 48px);
            }

            /* Mobile plants sitting at the bottom corners of cream section — untouched by narrow buttons */
            .mobile-plant-left {
                display: block;
                position: absolute;
                bottom: -5px;
                left: -30px;
                width: clamp(85px, 26vw, 150px);
                height: auto;
                z-index: 1;
                pointer-events: none;
            }

            .mobile-plant-right {
                display: block;
                position: absolute;
                bottom: -5px;
                right: -30px;
                width: clamp(95px, 28vw, 165px);
                height: auto;
                z-index: 1;
                pointer-events: none;
            }

            .mobile-footer {
                display: none;
            }
        }

        /* ═══════════════════════════════════════════════════
           MOBILE (≤ 600px)
        ═══════════════════════════════════════════════════ */
        @media (max-width: 600px) {

            .photo-section {
                height: 46vh;
                min-height: 340px;
            }

            /* .subtitle {
                font-size: clamp(14px, 4.4vw, 22px);
            } */

            .cta-btn {
                width: clamp(190px, 66vw, 280px);
                font-size: 16px;
            }

            .content {
                padding: clamp(20px, 4vw, 32px) 24px clamp(45px, 10vw, 80px);
                gap: clamp(12px, 3vw, 18px);
            }

            .social-icon {
                width: clamp(32px, 8vw, 44px);
            }

            .mobile-plant-left {
                width: clamp(80px, 26vw, 135px);
            }

            .mobile-plant-right {
                width: clamp(90px, 28vw, 150px);
            }
        }

        /* ═══════════════════════════════════════════════════
           VIDEO MODAL (Linktree Styled)
        ═══════════════════════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 28, 14, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            position: relative;
            width: 100%;
            max-width: 860px;
            background: var(--cream);
            border-radius: 24px;
            padding: 24px 24px 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(224, 123, 40, 0.2);
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: -16px;
            right: -16px;
            width: 44px;
            height: 44px;
            background: var(--orange);
            color: var(--white);
            border: 3px solid var(--cream);
            border-radius: 50%;
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, background 0.2s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--orange-hover);
            transform: scale(1.1);
        }

        .modal-video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .modal-video-wrapper iframe,
        .modal-video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: cover;
            border-radius: 16px;
        }

        @media (max-width: 600px) {
            .modal-card {
                padding: 16px 16px 14px;
                border-radius: 18px;
            }

            .modal-close {
                top: -14px;
                right: -14px;
                width: 38px;
                height: 38px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <!-- Google Tag Manager (noscript) -->
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NMWKKZL2" height="0" width="0"
                style="display:none;visibility:hidden"></iframe></noscript>
        <!-- End Google Tag Manager (noscript) -->
        <!-- ── DESKTOP: LEFT HERO PANEL (hidden on mobile) ── -->
        <div class="hero-panel" aria-hidden="true">
            <img class="bird bird-white" src="assets/AVE BLANCA.png" alt="">
            <img class="bird bird-parrot" src="assets/AVE ROJA.png" alt="">
            <img class="hero-logo" src="assets/Taino logo.svg" alt="Taino Bay Puerto Plata">
        </div>

        <!-- Wave / curve divider -->
        <div class="wave-divider" aria-hidden="true">
            <img src="vector-1.svg" alt="">
        </div>

        <!-- Desktop overlapping elements above wave curve & content -->
        <img class="bird bird-blue desktop-only" src="assets/AVE Azul.png" alt="" aria-hidden="true">
        <img class="plant-center desktop-only" src="assets/planta1.png" alt="" aria-hidden="true">

        <!-- ── MOBILE: HERO SECTION (hidden on desktop) ── -->
        <div class="photo-section" aria-hidden="true">
            <div class="photo-overlay"></div>
            <img class="mobile-bird-white" src="assets/AVE BLANCA.png" alt="">
            <img class="mobile-bird-blue" src="assets/AVE Azul.png" alt="">
            <img class="mobile-bird-parrot" src="assets/AVE ROJA.png" alt="">
            <img class="mobile-taino-logo" src="assets/Taino logo.svg" alt="Taino Bay Puerto Plata">
            <!-- Cream wave at bottom -->
            <div class="photo-wave">
                <svg viewBox="0 0 768 64" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0,64 L0,32 Q192,0 384,32 Q576,64 768,48 L768,64 Z" fill="#F4EEE0" />
                </svg>
            </div>
        </div>

        <!-- ── CONTENT PANEL (right desktop / center mobile) ── -->
        <section class="content" aria-label="Aviarius Bird Experience">

            <!-- Aviarius logo -->
            <img class="aviarius-logo" src="assets/LOGO AVIARIO.svg"
                alt="Aviarius Bird Experience – Taino Bay Puerto Plata">

            <p class="subtitle">Making&nbsp;feathery&nbsp;friends<br>
                and&nbsp;having&nbsp;the&nbsp;best&nbsp;time!</p>

            <!-- Two CTA buttons -->
            <div class="buttons">
                <a class="cta-btn" id="discover-aviarius-btn" href="#" target="_blank" rel="noopener">
                    <span class="btn-text">Discover Aviarius</span>
                    <img class="btn-arrow-icon" src="assets/arrow_back_ios.svg" alt="" aria-hidden="true">
                </a>
                <a class="cta-btn" id="port-tainobay-map-btn" href="https://porttainobay.com/en/map" target="_blank"
                    rel="noopener">
                    <span class="btn-text">Port Taino Bay&nbsp;Map</span>
                    <img class="btn-arrow-icon" src="assets/arrow_back_ios.svg" alt="" aria-hidden="true">
                </a>
            </div>

            <!-- Social links -->
            <div class="social-section">
                <p class="social-label">Let's connect!</p>
                <div class="social-icons">
                    <a class="social-icon-link" id="facebook-link" href="https://www.facebook.com/tainobayport/"
                        target="_blank" rel="noopener" aria-label="Aviarius en Facebook">
                        <img class="social-icon" src="assets/fb logo.svg" alt="Facebook">
                    </a>
                    <a class="social-icon-link" id="instagram-link" href="https://www.instagram.com/porttainobay"
                        target="_blank" rel="noopener" aria-label="Aviarius en Instagram">
                        <img class="social-icon" src="assets/ig logo.svg" alt="Instagram">
                    </a>
                    <a class="social-icon-link" id="tripadvisor-link"
                        href="https://www.tripadvisor.com.mx/Attraction_Review-g147290-d23803203-Reviews-Taino_Bay_Puerto_Plata-Puerto_Plata_Puerto_Plata_Province_Dominican_Republic.html"
                        target="_blank" rel="noopener" aria-label="Aviarius en TripAdvisor">
                        <img class="social-icon" src="assets/TripAdvisorLogo.svg" alt="TripAdvisor">
                    </a>
                </div>
            </div>

            <!-- Desktop plant: planta2 (palma+arbusto) — extrema derecha corner -->
            <img class="content-plant" src="assets/planta2.png" alt="" aria-hidden="true">

            <!-- Mobile plants: planta1 (left) & planta2 (right) at bottom corners of cream section -->
            <img class="mobile-plant-left" src="assets/planta1.png" alt="" aria-hidden="true">
            <img class="mobile-plant-right" src="assets/planta2.png" alt="" aria-hidden="true">

        </section>

        <!-- ── VIDEO MODAL ── -->
        <div id="video-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true"
            aria-label="Discover Aviarius Video">
            <div class="modal-card">
                <button id="modal-close-btn" class="modal-close" aria-label="Cerrar video">&times;</button>
                <div class="modal-video-wrapper">
                    <video id="modal-video-player" controls playsinline preload="metadata">
                        <source src="https://backends.itmgroup.mx/multimedia/videos/port-tainobay/aviario/aviario.mp4" type="video/mp4">
                        Tu navegador no soporta la reproducción de este video.
                    </video>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const discoverBtn = document.getElementById('discover-aviarius-btn');
            const videoModal = document.getElementById('video-modal');
            const closeModalBtn = document.getElementById('modal-close-btn');
            const videoPlayer = document.getElementById('modal-video-player');

            function openModal(e) {
                if (e) e.preventDefault();
                videoModal.classList.add('active');
                videoModal.setAttribute('aria-hidden', 'false');
                if (videoPlayer) {
                    videoPlayer.currentTime = 0;
                    videoPlayer.play().catch(function (err) {
                        console.log("Autoplay con sonido bloqueado por el navegador:", err);
                    });
                }
            }

            function closeModal() {
                videoModal.classList.remove('active');
                videoModal.setAttribute('aria-hidden', 'true');
                if (videoPlayer) {
                    videoPlayer.pause();
                    videoPlayer.currentTime = 0;
                }
            }

            if (discoverBtn) {
                discoverBtn.addEventListener('click', openModal);
            }

            if (closeModalBtn) {
                closeModalBtn.addEventListener('click', closeModal);
            }

            if (videoModal) {
                videoModal.addEventListener('click', function (e) {
                    if (e.target === videoModal) {
                        closeModal();
                    }
                });
            }

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && videoModal.classList.contains('active')) {
                    closeModal();
                }
            });
        });
    </script>
</body>

</html>
